<ion-view sb-page-background
          class="listcheckin listcheckin-home" cache-view="false">
  <ion-nav-title> {{ page_title }}</ion-nav-title>
  
  <ion-nav-buttons side="secondary">
      
      <button ng-if="is_logged_in && !is_loading && settings.isManager" 
              class="button button-clear header-item"
              ng-click="exportCsv(settings.locationId)">
            <i class="icon ion-document"></i>
      </button>
    </ion-nav-buttons>


  <ion-header-bar class="bar-subheader bar-custom bar bar-header" ng-if="is_logged_in && settings.isManager && !is_loading">
      <div class="button-bar text-center">
          <div class="button button-custom" ng-class="{ 'active' : action.tab == 'today'}" ng-click="action.tab = 'today'; loadManagerBooking()">
             {{ ::"Today" | translate:"listcheckin" }}
          </div>
          <div class="button button-custom"  ng-class="{ 'active' : action.tab == 'previous'}" ng-click="action.tab = 'previous'; loadManagerBooking()">
              {{ ::"Previous" | translate:"listcheckin" }}
          </div>
      </div>
  </ion-header-bar>
 
  <ion-content class="has-header"  
                ng-class="{ 'has-subheader' :  settings.isManager}" 
                scrollbar-y="false"
                overflow-scroll="false"
                delegate-handle="mainScroll">   	
    
      <div class="list" ng-if="!is_logged_in && !is_loading">
       <div class="item item-body item-custom listcheckin-login-button remove-border">
          <button class="button button-block button-positive button-positive-custom" ng-click="login()" >
            {{ ::"Click here to log-in" | translate:"listcheckin" }}
          </button>
       </div>
      </div>
   
      <div class="loader" ng-show="is_loading">
          <ion-spinner class="spinner-custom"></ion-spinner>
      </div>

     <ng-include ng-if="is_logged_in && !is_loading && !settings.isManager" src="'./features/listcheckin/assets/templates/l1/include/in_out.html'"></ng-include> 
     
     <ng-include ng-if="is_logged_in && !is_loading && payout_data.settings.check_in_history_enable == 1
      && !settings.isManager
      " src="'./features/listcheckin/assets/templates/l1/include/history.html'"></ng-include>

      <ng-include ng-if="is_logged_in && !is_loading && settings.isManager" src="'./features/listcheckin/assets/templates/l1/manager/list.html'"></ng-include>

  </ion-content>
 
</ion-view>
